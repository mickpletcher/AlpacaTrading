name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - master
      - 'codex/**'
  pull_request:

jobs:
  python-quality:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock.txt

      - name: Compile Python packages
        shell: pwsh
        run: |
          python -m compileall Alpaca Backtesting Journal rsi_macd_bot btc-signal-executor Operations Tests

      - name: Run pytest with coverage
        shell: pwsh
        run: |
          python -m pytest .\Tests -q --cov --cov-config=.coveragerc --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=50

      - name: Upload Python coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v7
        with:
          name: python-coverage
          path: coverage.xml

      - name: Validate installed dependencies
        shell: pwsh
        run: |
          python -m pip check

  powershell-quality:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Validate module manifests
        shell: pwsh
        run: |
          $repoSrc = (Resolve-Path .\src).Path
          $env:PSModulePath = "$repoSrc$([IO.Path]::PathSeparator)$env:PSModulePath"
          $manifests = Get-ChildItem .\src -Recurse -Filter *.psd1 -File
          foreach ($manifest in $manifests) {
            Test-ModuleManifest -Path $manifest.FullName | Out-Null
          }

      - name: Import PowerShell modules
        shell: pwsh
        run: |
          $repoSrc = (Resolve-Path .\src).Path
          $env:PSModulePath = "$repoSrc$([IO.Path]::PathSeparator)$env:PSModulePath"
          $moduleNames = Get-ChildItem .\src -Directory | Select-Object -ExpandProperty Name
          foreach ($moduleName in $moduleNames) {
            Import-Module $moduleName -Force
          }

      - name: Run script analyzer
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\scripts\Invoke-PowerShellStaticAnalysis.ps1

      - name: Run Pester with coverage
        shell: pwsh
        run: |
          $repoSrc = (Resolve-Path .\src).Path
          $env:PSModulePath = "$repoSrc$([IO.Path]::PathSeparator)$env:PSModulePath"
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = '.\Tests'
          $configuration.Run.PassThru = $true
          $configuration.Output.Verbosity = 'Detailed'
          $configuration.CodeCoverage.Enabled = $true
          $configuration.CodeCoverage.Path = @('.\src\*\*.psm1')
          $configuration.CodeCoverage.OutputFormat = 'JaCoCo'
          $configuration.CodeCoverage.OutputPath = '.\powershell-coverage.xml'
          $configuration.CodeCoverage.CoveragePercentTarget = 40
          $result = Invoke-Pester -Configuration $configuration
          if ($result.FailedCount -gt 0 -or $result.Result -ne 'Passed') {
            throw 'Pester tests or coverage threshold failed.'
          }

      - name: Upload PowerShell coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v7
        with:
          name: powershell-coverage
          path: powershell-coverage.xml

  documentation-quality:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate documentation authorities
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\scripts\docs-check.ps1 -FailOnGap
